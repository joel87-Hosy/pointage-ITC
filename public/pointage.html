<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pointage Agent</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(150deg, #0d47a1 0%, #1565c0 55%, #1976d2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: #fff;
      border-radius: 20px;
      padding: 44px 36px 36px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, .35);
      text-align: center;
    }

    .icon { font-size: 56px; margin-bottom: 14px; }

    h1 {
      color: #0d47a1;
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .subtitle {
      color: #888;
      font-size: 13px;
      margin-bottom: 32px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #444;
      text-align: left;
      margin-bottom: 7px;
    }

    input[type="text"] {
      width: 100%;
      padding: 13px 16px;
      font-size: 15px;
      border: 2px solid #e3e8f0;
      border-radius: 10px;
      outline: none;
      transition: border-color .2s;
      margin-bottom: 20px;
    }

    input[type="text"]:focus { border-color: #0d47a1; }

    /* Toggle Arrivee / Sortie */
    .type-toggle {
      display: flex;
      gap: 10px;
      margin-bottom: 22px;
    }

    .type-btn {
      flex: 1;
      padding: 11px 6px;
      font-size: 13.5px;
      font-weight: 700;
      border: 2px solid #e3e8f0;
      border-radius: 10px;
      cursor: pointer;
      background: #f5f7fb;
      color: #666;
      transition: all .2s;
    }

    .type-btn.active-arrivee {
      background: #e8f5e9;
      border-color: #43a047;
      color: #1b5e20;
    }

    .type-btn.active-sortie {
      background: #fff3e0;
      border-color: #fb8c00;
      color: #e65100;
    }

    .scan-choice {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .scan-btn {
      flex: 1;
      padding: 11px 6px;
      font-size: 13.5px;
      font-weight: 700;
      border: 2px solid #e3e8f0;
      border-radius: 10px;
      cursor: pointer;
      background: #f5f7fb;
      color: #666;
      transition: all .2s;
    }

    .scan-btn.active {
      background: #e3f2fd;
      border-color: #0d47a1;
      color: #0d47a1;
    }

    .badge-section {
      text-align: left;
      margin-bottom: 20px;
    }

    .badge-section input[type="text"] {
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    button[type="submit"] {
      width: 100%;
      padding: 14px;
      background: #0d47a1;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background .2s, transform .1s;
      letter-spacing: .3px;
    }

    button[type="submit"]:hover:not(:disabled) {
      background: #1565c0;
      transform: translateY(-1px);
    }

    button[type="submit"]:disabled {
      background: #b0bec5;
      cursor: not-allowed;
      transform: none;
    }

    .alert {
      display: none;
      margin-top: 22px;
      padding: 14px 16px;
      border-radius: 10px;
      font-size: 13.5px;
      line-height: 1.7;
      text-align: left;
    }

    .alert.success {
      background: #e8f5e9;
      color: #1b5e20;
      border: 1px solid #a5d6a7;
    }

    .alert.error {
      background: #ffebee;
      color: #b71c1c;
      border: 1px solid #ef9a9a;
    }

    /* Etat GPS */
    .geo-status {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #e3f2fd;
      border: 1px solid #90caf9;
      border-radius: 10px;
      padding: 11px 14px;
      font-size: 13px;
      color: #0d47a1;
      margin-bottom: 20px;
    }

    .geo-status.ok  { background: #e8f5e9; border-color: #a5d6a7; color: #1b5e20; }
    .geo-status.err { background: #ffebee; border-color: #ef9a9a; color: #b71c1c; }

    .known-agent {
      display: none;
      text-align: left;
      margin-bottom: 20px;
      padding: 12px 14px;
      border-radius: 10px;
      background: #e8f5e9;
      border: 1px solid #a5d6a7;
      color: #1b5e20;
      font-size: 13.5px;
      line-height: 1.5;
    }

    .known-agent strong { display: block; font-size: 15px; }

    /* spinner */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      width: 18px; height: 18px;
      border: 2px solid currentColor;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">&#128203;</div>
    <h1>Pointage des Agents</h1>
    <p class="subtitle">Selectionnez le type de pointage puis entrez votre nom</p>

    <!-- Statut GPS -->
    <div id="geo-box" class="geo-status">
      <div class="spinner"></div>
      <span>Localisation GPS en cours...</span>
    </div>

    <form id="form" autocomplete="off" novalidate style="display:none">
      <input type="hidden" id="badge-id-hidden" name="badge_id" value="" />
      <!-- Toggle Arrivee / Sortie -->
      <div class="type-toggle">
        <button type="button" id="btn-arrivee" class="type-btn active-arrivee" onclick="selectType('arrivee')">🟢 Arrivee</button>
        <button type="button" id="btn-sortie"  class="type-btn" onclick="selectType('sortie')">🔴 Sortie</button>
      </div>

      <div id="known-agent" class="known-agent"></div>

      <label id="nom-label" for="nom">Nom Complet</label>
      <input
        id="nom"
        type="text"
        placeholder="Ex : Mohamed Amine Benali"
        maxlength="100"
        required
      >

      <label for="code" style="margin-top: 14px;">Code Agent (optionnel)</label>
      <input
        id="code"
        type="password"
        placeholder="Code personnel"
        maxlength="20"
        autocomplete="off"
      >

      <button id="btn" type="submit">✅ Valider le Pointage Arrivee</button>
    </form>

    <div id="alert" class="alert" role="alert" aria-live="polite"></div>
  </div>

  <script>
    'use strict';

    // ─── Récupération du token dans l'URL ────────────────────────────────────
    const urlParams = new URLSearchParams(window.location.search);
    // Certains lecteurs de QR ou portails intermédiaires recopient les
    // paramètres après # au lieu de les laisser dans la query string.
    const fragmentParams = new URLSearchParams(window.location.hash.replace(/^#/, ''));
    let TOKEN = urlParams.get('token');
    let STATIC_QR = urlParams.get('static') || fragmentParams.get('static');
    // Traiter les valeurs communes invalides comme l'absence de token
    if (TOKEN === 'undefined' || TOKEN === 'null' || TOKEN === '') TOKEN = null;
    if (STATIC_QR === 'undefined' || STATIC_QR === 'null' || STATIC_QR === '') STATIC_QR = null;
    // Un lien direct ou un token malforme ne doit jamais afficher le formulaire.
    const HAS_VALID_TOKEN_FORMAT = typeof TOKEN === 'string' && /^[0-9a-f]{16}$/.test(TOKEN);
    const HAS_VALID_STATIC_QR_FORMAT = typeof STATIC_QR === 'string' && /^[0-9a-f]{16}$/.test(STATIC_QR);
    const HAS_INVALID_QR_PARAMETER = (TOKEN !== null && !HAS_VALID_TOKEN_FORMAT) ||
      (STATIC_QR !== null && !HAS_VALID_STATIC_QR_FORMAT);

    const form          = document.getElementById('form');
    const btn           = document.getElementById('btn');
    const alertEl       = document.getElementById('alert');
    const geoBox        = document.getElementById('geo-box');
    const btnArr        = document.getElementById('btn-arrivee');
    const btnSortie     = document.getElementById('btn-sortie');
    const badgeIdHidden = document.getElementById('badge-id-hidden');
    const nomInput      = document.getElementById('nom');
    const nomLabel      = document.getElementById('nom-label');
    const codeInput     = document.getElementById('code');
    const knownAgentBox = document.getElementById('known-agent');

    let userLat      = null;
    let userLng      = null;
    let selectedType = 'arrivee'; // type actif
    let SESSION_ID   = null; // sessionId creee apres validation du token
    let REGISTERED_AGENT = null;

    function selectScanMode() {
      initializeSession();
    }

    let codeReader = null;
    async function startCameraScanner() {
      if (typeof ZXingBrowser === 'undefined') return;
      if (codeReader) return;
      const qrRegion = document.getElementById('qr-reader');
      qrRegion.style.display = 'block';
      codeReader = new ZXingBrowser.BrowserMultiFormatReader();
      try {
        const hints = new Map();
        const formats = [
          ZXingBrowser.BarcodeFormat.QR_CODE,
          ZXingBrowser.BarcodeFormat.CODE_128
        ];
        hints.set(ZXingBrowser.DecodeHintType.POSSIBLE_FORMATS, formats);
        codeReader.setHints(hints);
      } catch {
        // ignore if hints are not supported
      }

      try {
        await codeReader.decodeFromVideoDevice(
          null,
          'qr-reader',
          async (result, error) => {
            if (result) {
              await onBadgeScanned(result.getText());
              await stopCameraScanner();
            }
          }
        );
      } catch (err) {
        console.warn('Camera scanner failed', err);
      }
    }

    async function stopCameraScanner() {
      if (!codeReader) return;
      try { codeReader.reset(); } catch {}
      codeReader = null;
    }

    window.addEventListener('beforeunload', () => { stopCameraScanner(); });

    function selectType(type) {
      selectedType = type;
      if (type === 'arrivee') {
        btnArr.className    = 'type-btn active-arrivee';
        btnSortie.className = 'type-btn';
        btn.textContent     = '✅ Valider le Pointage Arrivee';
        btn.style.background = '#1b5e20';
      } else {
        btnArr.className    = 'type-btn';
        btnSortie.className = 'type-btn active-sortie';
        btn.textContent     = '✅ Valider le Pointage Sortie';
        btn.style.background = '#e65100';
      }
      // Reset alerte si l'agent change de type après un échec
      alertEl.style.display = 'none';
    }

    function applyPointageStatus(status) {
      const arriveeDone = Boolean(status && status.arriveeDone);
      const sortieDone = Boolean(status && status.sortieDone);

      btnArr.disabled = arriveeDone;
      btnSortie.disabled = sortieDone;
      if (arriveeDone) btnArr.textContent = '✅ Arrivee faite';
      if (sortieDone) btnSortie.textContent = '✅ Sortie faite';

      if (arriveeDone) {
        selectType('sortie');
      } else {
        selectType('arrivee');
      }

      if (arriveeDone && sortieDone) {
        btn.disabled = true;
        btn.textContent = 'Pointages du jour deja faits';
        alertEl.className = 'alert error';
        alertEl.textContent = '❌ Vous avez deja effectue l arrivee et la sortie aujourd hui avec ce telephone.';
        alertEl.style.display = 'block';
      }
    }

    function applyRegisteredAgent(agent) {
      REGISTERED_AGENT = agent && agent.nom_agent ? agent : null;

      if (REGISTERED_AGENT) {
        nomInput.value = REGISTERED_AGENT.nom_agent;
        nomInput.required = false;
        nomInput.style.display = 'none';
        nomLabel.style.display = 'none';
        codeInput.value = '';
        codeInput.style.display = 'none';
        codeInput.previousElementSibling.style.display = 'none';
        knownAgentBox.innerHTML =
          'Telephone reconnu<br><strong>' + escHtml(REGISTERED_AGENT.nom_agent) + '</strong>';
        knownAgentBox.style.display = 'block';
        return;
      }

      nomInput.required = true;
      nomInput.style.display = '';
      nomLabel.style.display = '';
      codeInput.style.display = '';
      codeInput.previousElementSibling.style.display = '';
      knownAgentBox.style.display = 'none';
      knownAgentBox.textContent = '';
    }

    function escHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function showFatalError(msg) {
      geoBox.style.display  = 'none';
      form.style.display    = 'none';
      alertEl.className     = 'alert error';
      alertEl.textContent   = '❌ ' + msg;
      alertEl.style.display = 'block';
    }

    function getNavigationType() {
      const nav = performance.getEntriesByType && performance.getEntriesByType('navigation')[0];
      return nav && nav.type ? nav.type : 'navigate';
    }

    // ─── Device ID enrichi : inclut des propriétés du navigateur ────────────
    function getEnrichedDeviceId() {
      let id = null;
      try {
        id = localStorage.getItem('pointage_device_id');
      } catch {}
      if (!id) {
        // Créer un ID unique basé sur crypto + timestamp
        id = (crypto.randomUUID ? crypto.randomUUID() :
          Date.now().toString(36) + Math.random().toString(36).slice(2));
        try {
          localStorage.setItem('pointage_device_id', id);
        } catch {}
      }
      return id;
    }
    let DEVICE_ID = getEnrichedDeviceId();

    function rememberServerDeviceId(deviceId) {
      if (typeof deviceId !== 'string' || deviceId.length < 8) return;
      DEVICE_ID = deviceId;
      try {
        localStorage.setItem('pointage_device_id', deviceId);
      } catch {}
    }

    function rememberLocalAgentName(name) {
      if (typeof name !== 'string' || !name.trim()) return;
      try {
        localStorage.setItem('pointage_agent_name', name.trim().substring(0, 100));
      } catch {}
    }

    function getLocalAgentName() {
      try {
        const name = localStorage.getItem('pointage_agent_name');
        return typeof name === 'string' && name.trim() ? name.trim().substring(0, 100) : null;
      } catch {
        return null;
      }
    }

    // ─── INITIALISATION SÉCURISÉE : Valider le token et créer une session ────
    async function initializeSession() {
      const navigationType = getNavigationType();

      // L'URL est la source du QR. Certains navigateurs mobiles classent
      // l'ouverture d'un QR comme une navigation "reload"; ne rejeter le QR
      // statique que si les paramètres d'URL sont réellement absents/invalides.
      if (HAS_INVALID_QR_PARAMETER || (!HAS_VALID_TOKEN_FORMAT && !HAS_VALID_STATIC_QR_FORMAT)) {
        SESSION_ID = null;
        showFatalError("Lien de pointage invalide. Scannez le QR code affiche a l'ecran.");
        return;
      }

      geoBox.innerHTML = '<div class="spinner"></div><span>Verification du QR code...</span>';
      geoBox.style.display = 'block';
      form.style.display = 'none';

      try {
        // Appel au serveur pour valider le token et créer une session
        const res = await fetch('/init-session', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            token: HAS_VALID_TOKEN_FORMAT ? TOKEN : null,
            static_qr: HAS_VALID_STATIC_QR_FORMAT ? STATIC_QR : null,
            navigation_type: HAS_VALID_STATIC_QR_FORMAT ? 'qr' : navigationType,
            device_id: DEVICE_ID,
            known_agent_name: getLocalAgentName()
          })
        });

        const data = await res.json();

        if (res.ok && data.sessionId) {
          // Session creee avec succes
          rememberServerDeviceId(data.deviceId);
          SESSION_ID = data.sessionId;
          history.replaceState(null, document.title, '/pointage');
          applyPointageStatus(data);
          if (data.registeredAgent && data.registeredAgent.nom_agent) {
            rememberLocalAgentName(data.registeredAgent.nom_agent);
            applyRegisteredAgent(data.registeredAgent);
          } else {
            const localAgentName = getLocalAgentName();
            applyRegisteredAgent(localAgentName ? { nom_agent: localAgentName } : null);
          }
          geoBox.style.display = 'none';
          form.style.display = 'block';
          if (!data.arriveeDone || !data.sortieDone) alertEl.style.display = 'none';
        } else {
          // Token invalide ou expire
          showFatalError(data.error || 'QR code invalide. Rescannez le code.');
        }
      } catch (err) {
        showFatalError('Impossible de valider le QR code. Verifiez votre connexion.');
      }
    }

    // Tentative GPS en arriere-plan
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          userLat = pos.coords.latitude;
          userLng = pos.coords.longitude;
        },
        () => { /* GPS non disponible - silencieux */ },
        { enableHighAccuracy: false, timeout: 5000, maximumAge: 60000 }
      );
    }

    // Soumission du formulaire
    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const nom = REGISTERED_AGENT ? REGISTERED_AGENT.nom_agent : nomInput.value.trim();
      const codeAgent = REGISTERED_AGENT ? null : (codeInput.value.trim() || null);
      
      if (!nom) return;

      // La session courte creee apres scan est obligatoire.
      if (!SESSION_ID) {
        alertEl.className   = 'alert error';
        alertEl.textContent = '❌ Session expiree. Rescannez le QR code.';
        alertEl.style.display = 'block';
        return;
      }

      btn.disabled          = true;
      btn.textContent       = 'Enregistrement...';
      alertEl.style.display = 'none';

      try {
        const res = await fetch('/pointer', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            nom_agent: nom,
            code_agent: codeAgent,
            session_id: SESSION_ID,
            lat:       userLat,
            lng:       userLng,
            device_id: DEVICE_ID,
            user_agent: navigator.userAgent,
            type:      selectedType
          })
        });

        const data = await res.json();

        if (res.ok) {
          const isArrivee  = data.type !== 'sortie';
          const typeLabel  = isArrivee ? 'Arrivee' : 'Sortie';

          // Message principal
          let html =
            `<strong>✅ Pointage ${typeLabel} enregistre !</strong><br>` +
            `${isArrivee ? '🟢' : '🔴'} Agent : <strong>${escHtml(data.nom_agent)}</strong><br>` +
            `📅 Date  : <strong>${data.date}</strong><br>` +
            `🕐 Heure : <strong>${data.heure}</strong>`;

          // Message alerte retard / heures sup
          if (data.alerte) {
            const isRetard = data.alerte.type === 'retard';
            html += `<div style="margin-top:12px;padding:10px 12px;border-radius:8px;` +
              (isRetard
                ? `background:#ffebee;border:1px solid #ef9a9a;color:#b71c1c;`
                : `background:#fff3e0;border:1px solid #ffcc80;color:#e65100;`) +
              `font-size:13px;font-weight:600;">${escHtml(data.alerte.message)}</div>`;
          }

          alertEl.className = 'alert success';
          alertEl.innerHTML = html;
          rememberLocalAgentName(data.nom_agent);

          // Verrou local par type pour cet appareil aujourd'hui
          const todayKey = 'pointage_' + selectedType + '_done_' + new Date().toLocaleDateString('fr-FR');
          localStorage.setItem(todayKey, '1');

          // Masquer le bouton du type deja effectue
          if (isArrivee) {
            btnArr.disabled    = true;
            btnArr.textContent = '✅ Arrivee faite';
          } else {
            btnSortie.disabled    = true;
            btnSortie.textContent = '✅ Sortie faite';
          }

          if (!REGISTERED_AGENT) nomInput.value = '';
          codeInput.value = '';
          
          // Effacer le sessionId pour forcer un nouveau scan du QR code
          SESSION_ID = null;
        } else {
          alertEl.className   = 'alert error';
          alertEl.textContent = '❌ ' + (data.error || 'Une erreur est survenue.');
        }
      } catch {
        alertEl.className   = 'alert error';
        alertEl.textContent = '❌ Impossible de joindre le serveur. Verifiez votre connexion.';
      }

      alertEl.style.display = 'block';
      btn.disabled    = false;
      const currentLabel = selectedType === 'arrivee' ? '✅ Valider le Pointage Arrivee' : '✅ Valider le Pointage Sortie';
      btn.textContent = currentLabel;
    });

    // ─── Lancer l'initialisation du mode de pointage ─────────────────────────
    initializeSession();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.19.1/umd/index.min.js"></script>
</body>
</html>
